version: "3.7"

services:
  frontend-admin:
    image: node:20-alpine
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
    command: ["sh", "-c", "npm install && npm run dev"]
    working_dir: /home/node/app
    volumes:
      - ../frontend-admin:/home/node/app
    ports:
      - ${FRONTEND_ADMIN_HOST_PORT}:3000
  backend-admin:
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
    environment:
      MIX_ENV: dev
      DB_PORT: "${DB_PORT}"
      DB_HOST: "${DB_HOST}"
    volumes:
      - ../backend-admin:/release/backend-admin
    ports:
      - "${BACKEND_ADMIN_HOST_PORT}:4010"
    command:
      [
        "sh",
        "-c",
        "mix deps.get && mix deps.compile && mix phx.digest && /usr/local/bin/wait-for-it.sh db:5432 elasticsearch:9200 -t 0 -- mix phx.server",
      ]
  frontend-nuxt:
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
    command: ["bash", "-c", "yarn install && yarn dev"]
    volumes:
      - ../frontend-nuxt-3:/app
    ports:
      - ${FRONTEND_HOST_PORT}:5000
  backend:
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
    environment:
      MIX_ENV: dev
      DB_PORT: "${DB_PORT}"
      DB_HOST: "${DB_HOST}"
    volumes:
      - ../backend:/release/backend
      - ../data:${ALERT_MESSAGE_FILE_PATH}
    command:
      [
        "sh",
        "-c",
        "mix deps.get && mix deps.compile && mix phx.digest && /usr/local/bin/wait-for-it.sh db:5432 elasticsearch:9200 -t 0 -- mix phx.server",
      ]
  db:
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
  elasticsearch:
    restart: '${DOCKER_COMPOSE_RESTART:-no}'
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
