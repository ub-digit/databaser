---
docker_git_repo_url: https://github.com/ub-digit/databaser.git
docker_directory: './docker' # Default is './docker'
app_name: databaser

data_dir: /data/databaser

data_dirs:
  postgres:
    path: /data/databaser/postgres-data
    pull: false
    push: false
  elasticsearch:
    path: /data/databaser/elasticsearch-data
    pull: true
    push: true
  host_alert_message:
    path: /data/databaser/alert-msg-data
    pull: true
    push: true
